{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill text-primary"></i> Catálogo de Pacientes</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevoPaciente">
            <i class="bi bi-person-plus-fill me-1"></i> Nuevo Paciente
        </button>
    </div>

    <!-- 1. BARRA DE BÚSQUEDA EN VIVO (Sin <form>) -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <div class="row">
                <div class="col-12">
                    <input type="text" id="input-busqueda" class="form-control" placeholder="Buscar por C.I. o Nombre Completo...">
                </div>
            </div>
        </div>
    </div>

    <!-- 2. TABLA DE PACIENTES -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>C.I.</th>
                            <th>Nombre Completo</th>
                            <th>F. Nac. (Edad)</th>
                            <th>Género</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <!-- Aquí inyectamos el nuevo archivo -->
                    <tbody id="tabla-pacientes">
                        {% include 'pacientes/filas_tabla.html' %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA REGISTRAR PACIENTE (Campos corregidos) -->
<div class="modal fade" id="modalNuevoPaciente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form action="/pacientes/crear" method="POST">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-person-plus"></i> Registrar Nuevo Paciente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">C.I. / Documento *</label>
                            <input type="text" class="form-control" name="ci" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Nombre Completo *</label>
                            <input type="text" class="form-control" name="nombre_completo" required>
                        </div>
                        
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Fecha Nacimiento *</label>
                            <input type="date" class="form-control" name="fecha_nacimiento" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Género *</label>
                            <select class="form-select" name="sexo" required>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Teléfono / Celular</label>
                            <input type="text" class="form-control" name="telefono">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Guardar Paciente</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 3. SCRIPT PARA LIVE SEARCH -->
<script>
    document.getElementById('input-busqueda').addEventListener('input', function(e) {
        const query = e.target.value;
        // Consulta al backend pasando el texto que escribes
        fetch(`/pacientes/buscar_live?q=${encodeURIComponent(query)}`)
            .then(response => response.text())
            .then(html => {
                // Reemplaza el interior del tbody con la respuesta
                document.getElementById('tabla-pacientes').innerHTML = html;
            })
            .catch(error => console.error("Error en búsqueda:", error));
    });
</script>
{% endblock %}
